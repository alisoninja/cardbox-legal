<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<style>
  :root { --bg:#ffffff; --text:#1f2328; --muted:#59636e; --rule:#d1d9e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --text:#e6edf3; --muted:#9198a1; --rule:#3d444d; }
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; line-height: 1.3; margin: 0 0 24px; }
  h2 { font-size: 1.3rem; margin: 40px 0 8px; }
  h3 { font-size: 1.05rem; margin: 28px 0 8px; }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 40px 0; }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--rule); padding: 6px 10px; text-align: left; }
  code { font-size: .9em; }
  a { color: inherit; }
  main > p:last-child { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
</body>
</html>
